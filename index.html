

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ananta Technical Fiber Pvt Ltd</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: #f7d774;
            --bg: #000000;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Segoe UI Symbol', sans-serif;
            color: white;
        }

        body {
            position: relative;
        }

        /* subtle futuristic background glow */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at center,
                    rgba(212, 175, 55, 0.12) 0%,
                    rgba(212, 175, 55, 0.03) 25%,
                    transparent 55%);
            pointer-events: none;
        }

        .main-wrapper {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 18px 20px;
            position: relative;
            z-index: 2;
        }

        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .infinity {
            font-size: clamp(6rem, 14vw, 12rem);
            line-height: 1;
            color: var(--gold);
            text-shadow:
                0 0 10px rgba(212, 175, 55, 0.6),
                0 0 25px rgba(212, 175, 55, 0.45),
                0 0 40px rgba(212, 175, 55, 0.25);
            margin-bottom: 18px;
            font-weight: 300;
        }

        .company-name {
            color: #ffffff;
            font-size: clamp(1.2rem, 3vw, 2.3rem);
            font-weight: 500;
            letter-spacing: 1px;
            max-width: 900px;
            line-height: 1.4;
        }

        .contact-section {
            width: 100%;
            padding-bottom: 10px;
        }

        .contact-title {
            color: var(--gold-soft);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px 18px;
            font-size: 0.95rem;
            color: #d9d9d9;
        }

        .divider {
            color: var(--gold);
            opacity: 0.7;
        }

        .contact-info a {
            color: #d9d9d9;
            text-decoration: none;
        }

        .contact-info a:hover {
            color: var(--gold-soft);
        }

        @media (max-width: 576px) {
            .contact-info {
                flex-direction: column;
                gap: 6px;
            }

            .divider {
                display: none;
            }

            .company-name {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

    <div class="main-wrapper">

        <!-- Empty top spacer -->
        <div></div>

        <!-- Center Content -->
        <div class="center-content">
            <div class="infinity">∞</div>

            <div class="company-name">
                Ananta Technical Fibres Pvt. Ltd.
            </div>
        </div>

        <!-- Bottom Contact -->
        <div class="contact-section">

            <div class="contact-title">
                Contact
            </div>

            <div class="contact-info">
                <a href="tel:+919876543210">+91 98765 43210</a>

                <span class="divider">|</span>

                <a href="mailto:contact@anantatech.com">
                    contact@anantatech.com
                </a>

                <span class="divider">|</span>

                <a href="https://www.anantatech.com" target="_blank">
                    www.anantatech.com
                </a>
            </div>

        </div>

    </div>

</body>
</html>
